<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arce Shop</title>

  <!-- 1. Carga de SDKs de Firebase (compatibles CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- 2. Inicialización de Firebase (Única declaración global) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCElLtSnDC6IIALOaPCbmcBSxsKvRt_bpI",
      authDomain: "arceshop-99865.firebaseapp.com",
      projectId: "arceshop-99865",
      storageBucket: "arceshop-99865.firebasestorage.app",
      messagingSenderId: "202498685851",
      appId: "1:202498685851:web:66cd1b2a4599fb8c813f3e",
      measurementId: "G-P61NL74VKM"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Persistencia local sin warnings de deprecación
    db.enablePersistence().catch((err) => {
      console.warn("Persistencia local no disponible:", err.code);
    });
  </script>
</head>
<body>

  <h1>Arce Shop</h1>
  <div id="previewContainer">
    <img id="preview" src="" alt="Vista previa de imagen" style="max-width: 200px; display: block;" />
  </div>

  <input type="file" id="file" accept="image/*">
  <div id="productosContainer"></div>

  <!-- 3. Lógica principal de la aplicación -->
  <script>
    let todosLosProductos = [];

    // Carga rápida con límite y prevención de fallas
    function loadProducts() {
      db.collection('products')
        .orderBy('createdAt', 'desc')
        .limit(20)
        .onSnapshot((querySnapshot) => {
          todosLosProductos = [];
          querySnapshot.forEach((doc) => {
            todosLosProductos.push({ id: doc.id, ...doc.data() });
          });
          renderizarProductos();
        }, (error) => {
          console.error("Error cargando productos en tiempo real: ", error);
          // Fallback a caché si falla la red
          db.collection('products').limit(20).get({ source: 'cache' }).then((querySnapshot) => {
            todosLosProductos = [];
            querySnapshot.forEach((doc) => {
              todosLosProductos.push({ id: doc.id, ...doc.data() });
            });
            renderizarProductos();
          });
        });
    }

    function renderizarProductos() {
      const container = document.getElementById('productosContainer');
      if (!container) return;
      container.innerHTML = '';
      todosLosProductos.forEach(p => {
        const item = document.createElement('div');
        item.textContent = p.nombre || 'Producto sin nombre';
        container.appendChild(item);
      });
    }

    // Compresión eficiente de imágenes al subir
    const fileInput = document.getElementById('file');
    if (fileInput) {
      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              
              const MAX_WIDTH = 320;
              const scaleSize = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleSize;
              
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              
              const previewElem = document.getElementById('preview');
              if (previewElem) {
                previewElem.src = canvas.toDataURL('image/jpeg', 0.45);
              }
            };
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // Ejecutar al cargar el documento
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
    });
  </script>
</body>
</html>
